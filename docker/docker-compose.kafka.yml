name: inventario-kafka

x-broker: &broker
  image: confluentinc/cp-kafka:7.6.11
  depends_on:
    zookeeper:
      condition: service_healthy
  networks: [kafka-net]
  healthcheck:
    test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
    interval: 10s
    timeout: 10s
    retries: 15
    start_period: 20s
  environment: &broker-env
    KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
    KAFKA_DEFAULT_REPLICATION_FACTOR: 2
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.11
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [kafka-net]
    volumes:
      - zk-data:/var/lib/zookeeper/data
      - zk-log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "cub", "zk-ready", "localhost:2181", "5"]
      interval: 10s
      timeout: 8s
      retries: 12

  kafka1:
    <<: *broker
    ports: ["127.0.0.1:${KAFKA_PORT_1:-9092}:9092"]
    environment:
      <<: *broker-env
      KAFKA_BROKER_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:${KAFKA_PORT_1:-9092}
    volumes:
      - kafka1-data:/var/lib/kafka/data

  kafka2:
    <<: *broker
    ports: ["127.0.0.1:${KAFKA_PORT_2:-9093}:9092"]
    environment:
      <<: *broker-env
      KAFKA_BROKER_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:29092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:${KAFKA_PORT_2:-9093}
    volumes:
      - kafka2-data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: inventario
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:29092,kafka2:29092
      KAFKA_CLUSTERS_0_READONLY: "false"
    networks: [kafka-net]
    ports: ["127.0.0.1:${KAFKA_UI_PORT:-8085}:8080"]

networks:
  kafka-net:

volumes:
  zk-data:
  zk-log:
  kafka1-data:
  kafka2-data:
