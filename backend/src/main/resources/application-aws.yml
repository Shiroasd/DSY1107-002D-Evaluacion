# Perfil de Despliegue en AWS (EC2 + AWS RDS PostgreSQL + AWS API Gateway)
# Activar ejecutando: java -jar inventory-backend-1.0.0.jar --spring.profiles.active=aws
server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/inventorydb}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true

  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:always}
      data-locations: classpath:data.sql

  h2:
    console:
      enabled: false

  # Configuración explícita de Microsoft Entra ID (Resource Server) en AWS
  cloud:
    azure:
      active-directory:
        enabled: true
        profile:
          tenant-id: ${AZURE_TENANT_ID:73d72038-30bf-4ab9-85bc-a402de679470}
        credential:
          client-id: ${AZURE_CLIENT_ID:afcd0a4e-f3f3-4934-9861-4d8d13cecc30}
        client-id: ${AZURE_CLIENT_ID:afcd0a4e-f3f3-4934-9861-4d8d13cecc30}
        app-id-uri: ${AZURE_APP_ID_URI:api://afcd0a4e-f3f3-4934-9861-4d8d13cecc30}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:73d72038-30bf-4ab9-85bc-a402de679470}/v2.0
          jwk-set-uri: https://login.microsoftonline.com/common/discovery/v2.0/keys
          audiences:
            - ${AZURE_CLIENT_ID:afcd0a4e-f3f3-4934-9861-4d8d13cecc30}
            - ${AZURE_APP_ID_URI:api://afcd0a4e-f3f3-4934-9861-4d8d13cecc30}
            - 57c1db2d-484b-463a-b993-45c3ef349e3c
            - 61d2f1d7-99e9-4cf7-83fc-51456a9eb5b6

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    com.retail.inventory: INFO

# Configuración de CORS para el Frontend Angular migrado a AWS
app:
  security:
    default-admin: true
  cors:
    allowed-origins:
      - "https://32.193.45.223"
      - "http://localhost:4200"
      - "http://127.0.0.1:4200"
      - "https://localhost:4200"
    allowed-methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
      - "PATCH"
      - "HEAD"
    allowed-headers:
      - "Authorization"
      - "Content-Type"
      - "Accept"
      - "Origin"
      - "X-Requested-With"
      - "Access-Control-Request-Method"
      - "Access-Control-Request-Headers"
    exposed-headers:
      - "Authorization"
      - "Location"

