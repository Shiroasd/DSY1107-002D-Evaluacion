# Perfil de Despliegue en AWS (EC2 + AWS RDS PostgreSQL + AWS API Gateway)
# Activar ejecutando: java -jar inventory-backend-1.0.0.jar --spring.profiles.active=aws
server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/inventorydb}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true

  sql:
    init:
      mode: never

  h2:
    console:
      enabled: false

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    com.retail.inventory: INFO

# Configuración explícita de Microsoft Entra ID (Resource Server) en AWS
spring:
  cloud:
    azure:
      active-directory:
        enabled: true
        profile:
          tenant-id: ${AZURE_TENANT_ID:73d72038-30bf-4ab9-85bc-a402de679470}
        credential:
          client-id: ${AZURE_CLIENT_ID:afcd0a4e-f3f3-4934-9861-4d8d13cecc30}
        client-id: ${AZURE_CLIENT_ID:afcd0a4e-f3f3-4934-9861-4d8d13cecc30}
        app-id-uri: ${AZURE_APP_ID_URI:api://afcd0a4e-f3f3-4934-9861-4d8d13cecc30}

# Configuración de CORS para el Frontend Angular migrado a AWS
app:
  cors:
    allowed-origins:
      - "https://32.193.45.223"
      - "http://localhost:4200"
      - "http://127.0.0.1:4200"
      - "https://localhost:4200"
    allowed-methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
      - "PATCH"
      - "HEAD"
    allowed-headers:
      - "Authorization"
      - "Content-Type"
      - "Accept"
      - "Origin"
      - "X-Requested-With"
      - "Access-Control-Request-Method"
      - "Access-Control-Request-Headers"
    exposed-headers:
      - "Authorization"
      - "Location"

