server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: inventory-backend

  # Configuración exacta de Microsoft Entra ID (Azure Active Directory / Resource Server)
  cloud:
    azure:
      active-directory:
        enabled: true
        profile:
          tenant-id: ${AZURE_TENANT_ID:73d72038-30bf-4ab9-85bc-a402de679470}
        credential:
          client-id: ${AZURE_CLIENT_ID:afcd0a4e-f3f3-4934-9861-4d8d13cecc30}
        client-id: ${AZURE_CLIENT_ID:afcd0a4e-f3f3-4934-9861-4d8d13cecc30}
        app-id-uri: ${AZURE_APP_ID_URI:api://afcd0a4e-f3f3-4934-9861-4d8d13cecc30}

  # Configuración estándar de Spring Security OAuth2 Resource Server para validación de tokens JWT
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:73d72038-30bf-4ab9-85bc-a402de679470}/v2.0
          jwk-set-uri: https://login.microsoftonline.com/common/discovery/v2.0/keys
          audiences:
            - ${AZURE_CLIENT_ID:afcd0a4e-f3f3-4934-9861-4d8d13cecc30}
            - ${AZURE_APP_ID_URI:api://afcd0a4e-f3f3-4934-9861-4d8d13cecc30}
            - 57c1db2d-484b-463a-b993-45c3ef349e3c
            - 61d2f1d7-99e9-4cf7-83fc-51456a9eb5b6

  # Configuración de Persistencia (H2 para desarrollo/test local, AWS RDS / PostgreSQL para Cloud)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:inventorydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:create-drop}
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:always}
      data-locations: classpath:data.sql
      encoding: UTF-8

# Logging para auditoría de seguridad y endpoints
logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.springframework.security.oauth2: DEBUG
    com.azure.spring.cloud.autoconfigure.implementation.aad: INFO
    com.retail.inventory: DEBUG

# Configuración de CORS para el Frontend Angular migrado a AWS
app:
  security:
    default-admin: true
  cors:
    allowed-origins:
      - "https://32.193.45.223"
      - "http://localhost:4200"
      - "http://127.0.0.1:4200"
      - "https://localhost:4200"
    allowed-methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
      - "PATCH"
      - "HEAD"
    allowed-headers:
      - "Authorization"
      - "Content-Type"
      - "Accept"
      - "Origin"
      - "X-Requested-With"
      - "Access-Control-Request-Method"
      - "Access-Control-Request-Headers"
    exposed-headers:
      - "Authorization"
      - "Location"

